name: Signed Android release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mikutea/sms-to-email-forwarder'
    runs-on: ubuntu-latest
    environment: signed-release
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up and verify Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Validate stable release inputs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.YANJIAN_RELEASE_KEYSTORE_BASE64 }}
          YANJIAN_KEYSTORE_PASSWORD: ${{ secrets.YANJIAN_RELEASE_KEYSTORE_PASSWORD }}
          YANJIAN_KEY_ALIAS: ${{ secrets.YANJIAN_RELEASE_KEY_ALIAS }}
          YANJIAN_KEY_PASSWORD: ${{ secrets.YANJIAN_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APP_VERSION="$(cd clients/android && ./gradlew -q :app:printVersionName)"
          APP_VERSION_CODE="$(cd clients/android && ./gradlew -q :app:printVersionCode)"
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}"
          case "${APP_VERSION}" in *-*) echo "Prerelease version cannot create a stable release" >&2; exit 1;; esac
          test "${APP_VERSION_CODE}" -gt 0
          test -f "docs/release-notes/${APP_VERSION}.md"
          test -n "${KEYSTORE_BASE64}"
          test -n "${YANJIAN_KEYSTORE_PASSWORD}"
          test -n "${YANJIAN_KEY_ALIAS}"
          test -n "${YANJIAN_KEY_PASSWORD}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          echo "APP_VERSION=${APP_VERSION}" >> "${GITHUB_ENV}"
          echo "APP_VERSION_CODE=${APP_VERSION_CODE}" >> "${GITHUB_ENV}"

      - name: Materialize ephemeral release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.YANJIAN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/yanjian-release.jks"

      - name: Test, lint, and build signed release
        working-directory: clients/android
        env:
          YANJIAN_KEYSTORE_FILE: ${{ runner.temp }}/yanjian-release.jks
          YANJIAN_KEYSTORE_PASSWORD: ${{ secrets.YANJIAN_RELEASE_KEYSTORE_PASSWORD }}
          YANJIAN_KEY_ALIAS: ${{ secrets.YANJIAN_RELEASE_KEY_ALIAS }}
          YANJIAN_KEY_PASSWORD: ${{ secrets.YANJIAN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease

      - name: Package and verify signed APK
        shell: bash
        env:
          YANJIAN_KEYSTORE_PASSWORD: ${{ secrets.YANJIAN_RELEASE_KEYSTORE_PASSWORD }}
          YANJIAN_KEY_ALIAS: ${{ secrets.YANJIAN_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/yanjian-v${APP_VERSION}.apk"
          cp clients/android/app/build/outputs/apk/release/app-release.apk "${APK}"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${APK}" \
            > dist/SIGNING_CERTIFICATE.txt
          keytool -exportcert -rfc \
            -keystore "${RUNNER_TEMP}/yanjian-release.jks" \
            -storepass:env YANJIAN_KEYSTORE_PASSWORD \
            -alias "${YANJIAN_KEY_ALIAS}" \
            -file dist/yanjian-release-certificate.pem

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: clients/android
          format: cyclonedx-json
          output-file: dist/yanjian-v${{ env.APP_VERSION }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum \
            "yanjian-v${APP_VERSION}.apk" \
            "yanjian-v${APP_VERSION}.sbom.cdx.json" \
            yanjian-release-certificate.pem \
            SIGNING_CERTIFICATE.txt > SHA256SUMS.txt)

      - name: Attest APK build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/yanjian-v${{ env.APP_VERSION }}.apk

      - name: Upload immutable workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yanjian-v${{ env.APP_VERSION }}-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "雁笺 ${APP_VERSION}" \
            --notes-file "docs/release-notes/${APP_VERSION}.md"

      - name: Remove ephemeral keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/yanjian-release.jks"
